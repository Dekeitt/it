spring:
  datasource:
    url: jdbc:h2:mem:itdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}

security:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-me-32}
    issuer: ${JWT_ISSUER:clean-it-local}
    audience: ${JWT_AUDIENCE:clean-it-api}
    jwk-set-uri: ""
  basic:
    enabled: ${ALLOW_BASIC_AUTH:false}
    username: ${BASIC_AUTH_USERNAME:}
    password: ${BASIC_AUTH_PASSWORD:}
