<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>it | Cleaners Marketplace</title>
  <meta name="description" content="Marketplace para reservar servicios de limpieza, gestionar jobs y pagos." />
  <meta name="theme-color" content="#08111f" />
  <link rel="stylesheet" href="/ui.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <style>
    :root{
      --bg:#08111f;
      --bg-soft:#0f172a;
      --card:rgba(15,23,42,.82);
      --card-2:#111c33;
      --line:rgba(148,163,184,.16);
      --text:#e2e8f0;
      --muted:#94a3b8;
      --accent:#60a5fa;
      --accent-2:#22c55e;
      --warn:#f59e0b;
      --danger:#ef4444;
      --shadow:0 18px 45px rgba(0,0,0,.28);
      --radius:22px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      color:var(--text);
      background:
        radial-gradient(circle at top left, rgba(96,165,250,.22), transparent 26%),
        radial-gradient(circle at top right, rgba(34,197,94,.16), transparent 22%),
        linear-gradient(180deg, #020617 0%, var(--bg) 35%, #06101d 100%);
      min-height:100vh;
    }
    a{color:inherit}
    button,input,select,textarea{font:inherit}
    .app{max-width:1500px;margin:0 auto;padding:24px}
    .topbar{
      display:flex;justify-content:space-between;align-items:center;gap:16px;
      padding:18px 20px;border:1px solid var(--line);border-radius:28px;
      background:rgba(2,6,23,.78);backdrop-filter:blur(18px);box-shadow:var(--shadow);position:sticky;top:14px;z-index:20
    }
    .brand{display:flex;align-items:center;gap:14px}
    .brand-badge{
      width:46px;height:46px;border-radius:16px;display:grid;place-items:center;
      background:linear-gradient(135deg,var(--accent),#8b5cf6);font-weight:800;font-size:20px;color:white
    }
    .brand h1{margin:0;font-size:18px}
    .brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
    .top-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
    .pill,.nav-btn,.ghost,.primary,.danger{
      border:1px solid var(--line);background:rgba(15,23,42,.78);color:var(--text);
      border-radius:999px;padding:10px 14px;cursor:pointer;transition:.15s ease
    }
    .pill:hover,.nav-btn:hover,.ghost:hover,.primary:hover,.danger:hover{transform:translateY(-1px);border-color:rgba(96,165,250,.4)}
    .primary{background:linear-gradient(135deg,var(--accent),#7c3aed);border-color:transparent;font-weight:700}
    .danger{background:linear-gradient(135deg,#ef4444,#f97316);border-color:transparent;font-weight:700}
    .grid{display:grid;grid-template-columns:260px 1fr;gap:18px;margin-top:18px}
    .sidebar,.panel,.hero,.card,.screen{
      background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)
    }
    .sidebar{padding:16px;position:sticky;top:92px;height:fit-content}
    .nav-list{display:grid;gap:8px}
    .nav-btn{width:100%;text-align:left}
    .nav-btn.active{background:linear-gradient(135deg,rgba(96,165,250,.22),rgba(124,58,237,.18));border-color:rgba(96,165,250,.5)}
    .screen{padding:22px;min-height:calc(100vh - 180px)}
    .hero{padding:26px;background:
      linear-gradient(135deg, rgba(15,23,42,.88), rgba(3,7,18,.7)),
      radial-gradient(circle at top right, rgba(96,165,250,.22), transparent 32%)}
    .hero-grid{display:grid;grid-template-columns:1.6fr .9fr;gap:16px}
    .headline{font-size:44px;line-height:1.05;margin:6px 0 12px;max-width:820px}
    .sub{color:var(--muted);font-size:16px;max-width:780px;line-height:1.55}
    .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:18px}
    .stat{padding:16px;border-radius:20px;background:rgba(15,23,42,.75);border:1px solid var(--line)}
    .stat strong{display:block;font-size:24px}
    .stat span{color:var(--muted);font-size:13px}
    .mini-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .card{padding:18px;background:var(--card-2)}
    .section-title{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:0 0 14px}
    .section-title h2,.section-title h3{margin:0}
    .section-title p{margin:0;color:var(--muted)}
    .chips{display:flex;gap:8px;flex-wrap:wrap}
    .chip{padding:8px 12px;border-radius:999px;background:rgba(96,165,250,.12);border:1px solid rgba(96,165,250,.2);color:#bfdbfe;font-size:13px}
    .filters{display:grid;grid-template-columns:1.2fr .8fr .8fr;gap:10px;margin-bottom:14px}
    .input,.textarea,.select{
      width:100%;padding:12px 14px;border-radius:16px;border:1px solid var(--line);
      background:rgba(15,23,42,.9);color:var(--text);outline:none
    }
    .textarea{min-height:120px;resize:vertical}
    .list{display:grid;gap:12px}
    .cleaner-card,.job-card,.reservation-card,.payment-card,.review-card,.endpoint-card{
      padding:16px;border-radius:20px;background:rgba(2,6,23,.55);border:1px solid var(--line)
    }
    .card-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
    .muted{color:var(--muted)}
    .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
    .tag{font-size:12px;padding:6px 10px;border-radius:999px;background:rgba(148,163,184,.11);border:1px solid rgba(148,163,184,.16)}
    .tag.good{background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.18);color:#86efac}
    .tag.warn{background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.18);color:#fcd34d}
    .tag.info{background:rgba(96,165,250,.12);border-color:rgba(96,165,250,.18);color:#bfdbfe}
    .row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .row-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
    .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
    .message{
      padding:14px 16px;border-radius:18px;margin-bottom:14px;border:1px solid transparent
    }
    .message.info{background:rgba(96,165,250,.12);border-color:rgba(96,165,250,.22)}
    .message.ok{background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.22)}
    .message.error{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.22)}
    .toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
    .divider{height:1px;background:var(--line);margin:16px 0}
    .two-col{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}
    .three-col{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
    .scroll{max-height:360px;overflow:auto;padding-right:4px}
    .table{width:100%;border-collapse:collapse}
    .table th,.table td{padding:10px 8px;border-bottom:1px solid rgba(148,163,184,.12);text-align:left;font-size:14px;vertical-align:top}
    .kpi{font-size:32px;font-weight:800}
    .small{font-size:12px;color:var(--muted)}
    .footer-note{margin-top:16px;color:var(--muted);font-size:13px}
    @media (max-width:1100px){
      .grid,.hero-grid,.two-col,.three-col,.row,.row-3,.filters,.stats,.mini-grid{grid-template-columns:1fr}
      .sidebar{position:static}
      .headline{font-size:34px}
    }
  </style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useCallback, useEffect, useMemo, useState } = React;

const screens = [
  { id: 'home', label: 'Inicio' },
  { id: 'discover', label: 'Explorar' },
  { id: 'jobs', label: 'Jobs' },
  { id: 'reservation', label: 'Reservas' },
  { id: 'payments', label: 'Pagos' },
  { id: 'reviews', label: 'Reseñas' },
  { id: 'client', label: 'Cliente' },
  { id: 'cleaner', label: 'Cleaner' },
  { id: 'api', label: 'API' },
];

const sampleQuotes = [
  'Descubre limpiadores premium al estilo marketplace.',
  'Publica trabajos y convierte visitas en reservas.',
  'Gestiona pagos, reseñas y disponibilidad desde una sola UI.'
];

function loadAuth() {
  try {
    return JSON.parse(sessionStorage.getItem('it-auth') || '{"mode":"none","token":"","basicUser":"","basicPassword":"","email":"client@example.com"}');
  } catch {
    return { mode: 'none', token: '', basicUser: '', basicPassword: '', email: 'client@example.com' };
  }
}

function saveAuth(next) {
  sessionStorage.setItem('it-auth', JSON.stringify(next));
}

function money(cents) {
  const value = Number(cents || 0) / 100;
  return new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR' }).format(value);
}

function timeLabel(value) {
  if (!value) return '—';
  try {
    return new Intl.DateTimeFormat('es-ES', { dateStyle: 'medium', timeStyle: 'short' }).format(new Date(value));
  } catch {
    return String(value);
  }
}

function authHeader(auth) {
  if (auth.mode === 'bearer' && auth.token) return { Authorization: 'Bearer ' + auth.token };
  if (auth.mode === 'basic' && auth.basicUser) {
    return { Authorization: `Basic ${btoa(`${auth.basicUser}:${auth.basicPassword || ''}`)}` };
  }
  return {};
}

function App() {
  const [screen, setScreen] = useState('home');
  const [auth, setAuth] = useState(loadAuth());
  const [busy, setBusy] = useState(false);
  const [message, setMessage] = useState({ type: 'info', text: 'Explora el marketplace y conecta clientes con cleaners.' });
  const [cleaners, setCleaners] = useState([]);
  const [jobs, setJobs] = useState([]);
  const [reservations, setReservations] = useState([]);
  const [payments, setPayments] = useState([]);
  const [reviews, setReviews] = useState([]);
  const [selectedCleaner, setSelectedCleaner] = useState('');
  const [reviewTarget, setReviewTarget] = useState('');
  const [paymentReservationId, setPaymentReservationId] = useState('');
  const [searchTerm, setSearchTerm] = useState('');
  const [forms, setForms] = useState({
    cleaner: { email: '', name: '', rating: 5 },
    job: { title: '', description: '', priceCents: 4500 },
    reservation: { jobId: '', cleanerEmail: '', startAt: '', durationMinutes: 120 },
    review: { cleanerEmail: '', rating: 5, comment: '' },
    payment: { reservationId: '' },
  });

  const request = useCallback(async (path, options = {}) => {
    const headers = { ...(options.headers || {}), ...authHeader(auth) };
    if (!(options.body instanceof FormData) && options.body && !headers['Content-Type']) {
      headers['Content-Type'] = 'application/json';
    }
    const response = await fetch(path, { ...options, headers });
    const contentType = response.headers.get('content-type') || '';
    const body = contentType.includes('application/json') ? await response.json() : await response.text();
    if (response.status === 401) {
      sessionStorage.removeItem('it-auth');
      setAuth({ mode: 'none', token: '', basicUser: '', basicPassword: '', email: auth.email || 'client@example.com' });
    }
    if (!response.ok) {
      const error = typeof body === 'string' ? body : body.detail || body.error || body.message || `HTTP ${response.status}`;
      throw new Error(error);
    }
    return body;
  }, [auth]);

  const loadReviews = useCallback(async (email) => {
    if (!email) return;
    try {
      let data;
      try {
        data = await request(`/api/reviews/${encodeURIComponent(email)}`);
      } catch (primaryError) {
        data = await request(`/api/cleaners/${encodeURIComponent(email)}/reviews`);
      }
      setReviews(Array.isArray(data) ? data : []);
    } catch (error) {
      setReviews([]);
      setMessage({ type: 'error', text: `Reseñas: ${error.message}` });
    }
  }, [request]);

  const loadMarketplace = useCallback(async () => {
    setBusy(true);
    try {
      const [cleanerList, jobList] = await Promise.all([
        request('/api/cleaners').catch(() => []),
        request('/api/jobs/open').catch(() => []),
      ]);
      setCleaners(Array.isArray(cleanerList) ? cleanerList : []);
      setJobs(Array.isArray(jobList) ? jobList : []);
      if (Array.isArray(cleanerList) && cleanerList.length) {
        const firstCleaner = cleanerList[0].email;
        setSelectedCleaner((current) => current || firstCleaner);
        setReviewTarget((current) => current || firstCleaner);
        loadReviews(firstCleaner).catch(() => null);
      }
    } catch (error) {
      setMessage({ type: 'error', text: error.message });
    } finally {
      setBusy(false);
    }
  }, [loadReviews, request]);

  const loadReservations = useCallback(async () => {
    try {
      const data = await request('/api/reservations');
      setReservations(Array.isArray(data) ? data : []);
    } catch (error) {
      setReservations([]);
      setMessage({ type: 'error', text: `Reservas: ${error.message}` });
    }
  }, [request]);

  const loadPayments = useCallback(async (reservationId = '') => {
    try {
      const query = reservationId ? `?reservationId=${encodeURIComponent(reservationId)}` : '';
      const data = await request(`/api/payments${query}`);
      setPayments(Array.isArray(data) ? data : []);
    } catch (error) {
      setPayments([]);
      setMessage({ type: 'error', text: `Pagos: ${error.message}` });
    }
  }, [request]);

  useEffect(() => {
    saveAuth(auth);
  }, [auth]);

  useEffect(() => {
    loadMarketplace();
  }, [loadMarketplace]);

  useEffect(() => {
    if (screen === 'client') loadReservations();
  }, [loadReservations, screen]);

  useEffect(() => {
    if (screen === 'payments') loadPayments(paymentReservationId);
  }, [loadPayments, paymentReservationId, screen]);

  useEffect(() => {
    if (screen === 'reviews' && reviewTarget) loadReviews(reviewTarget);
  }, [loadReviews, reviewTarget, screen]);

  const featured = useMemo(() => cleaners.slice(0, 4), [cleaners]);
  const filteredCleaners = useMemo(
    () => cleaners.filter((cleaner) => `${cleaner.name || ''} ${cleaner.email || ''}`.toLowerCase().includes(searchTerm.toLowerCase())),
    [cleaners, searchTerm]
  );
  const filteredJobs = useMemo(
    () => jobs.filter((job) => `${job.title || ''} ${job.description || ''} ${job.clientEmail || ''}`.toLowerCase().includes(searchTerm.toLowerCase())),
    [jobs, searchTerm]
  );
  const stats = useMemo(() => ([
    { label: 'Cleaners', value: cleaners.length },
    { label: 'Jobs abiertos', value: jobs.length },
    { label: 'Reservas', value: reservations.length },
    { label: 'Reseñas', value: reviews.length },
  ]), [cleaners.length, jobs.length, reservations.length, reviews.length]);
  const publicCards = useMemo(() => [
    { title: 'Descubrir', text: 'Explora cleaners con rating, reviews y disponibilidad.' },
    { title: 'Reservar', text: 'Reserva un servicio con fecha, duración y referencia de job.' },
    { title: 'Cobrar', text: 'Genera payment intents y sigue el estado del cobro.' },
    { title: 'Valorar', text: 'Publica reseñas y construye confianza en el marketplace.' },
  ], []);

  const setForm = (group, field, value) => setForms((current) => ({
    ...current,
    [group]: { ...current[group], [field]: value },
  }));

  const submitCleaner = async (event) => {
    event.preventDefault();
    setBusy(true);
    try {
      const payload = { ...forms.cleaner, rating: Number(forms.cleaner.rating) };
      await request('/api/cleaners', { method: 'POST', body: JSON.stringify(payload) });
      setMessage({ type: 'ok', text: 'Cleaner creado con éxito.' });
      setForms((current) => ({ ...current, cleaner: { email: '', name: '', rating: 5 } }));
      loadMarketplace();
    } catch (error) {
      setMessage({ type: 'error', text: error.message });
    } finally {
      setBusy(false);
    }
  };

  const submitJob = async (event) => {
    event.preventDefault();
    setBusy(true);
    try {
      const payload = {
        title: forms.job.title || null,
        description: forms.job.description,
        priceCents: Number(forms.job.priceCents),
      };
      await request('/api/jobs', { method: 'POST', body: JSON.stringify(payload) });
      setMessage({ type: 'ok', text: 'Job publicado y visible en el marketplace.' });
      setForms((current) => ({ ...current, job: { title: '', description: '', priceCents: 4500 } }));
      loadMarketplace();
    } catch (error) {
      setMessage({ type: 'error', text: error.message });
    } finally {
      setBusy(false);
    }
  };

  const acceptJob = async (jobId) => {
    setBusy(true);
    try {
      await request(`/api/jobs/${jobId}/accept`, { method: 'POST' });
      setMessage({ type: 'ok', text: `Job ${jobId} aceptado.` });
      loadMarketplace();
    } catch (error) {
      setMessage({ type: 'error', text: error.message });
    } finally {
      setBusy(false);
    }
  };

  const submitReservation = async (event) => {
    event.preventDefault();
    setBusy(true);
    try {
      const payload = {
        jobId: Number(forms.reservation.jobId),
        cleanerEmail: forms.reservation.cleanerEmail,
        startAt: forms.reservation.startAt,
        durationMinutes: Number(forms.reservation.durationMinutes),
      };
      const result = await request('/api/reservations', { method: 'POST', body: JSON.stringify(payload) });
      setMessage({ type: 'ok', text: `Reserva creada (#${result.id}).` });
      setForms((current) => ({ ...current, reservation: { jobId: '', cleanerEmail: current.reservation.cleanerEmail, startAt: '', durationMinutes: 120 } }));
      loadReservations();
    } catch (error) {
      setMessage({ type: 'error', text: error.message });
    } finally {
      setBusy(false);
    }
  };

  const submitReview = async (event) => {
    event.preventDefault();
    setBusy(true);
    try {
      const payload = {
        cleanerEmail: forms.review.cleanerEmail,
        rating: Number(forms.review.rating),
        comment: forms.review.comment,
      };
      await request('/api/reviews', { method: 'POST', body: JSON.stringify(payload) });
      setMessage({ type: 'ok', text: 'Reseña publicada.' });
      setForms((current) => ({ ...current, review: { cleanerEmail: current.review.cleanerEmail, rating: 5, comment: '' } }));
      loadReviews(forms.review.cleanerEmail);
    } catch (error) {
      setMessage({ type: 'error', text: error.message });
    } finally {
      setBusy(false);
    }
  };

  const submitPayment = (event) => {
    event.preventDefault();
    const reservationId = Number(forms.payment.reservationId);
    if (!Number.isInteger(reservationId) || reservationId <= 0) {
      setMessage({ type: 'error', text: 'Introduce un ID de reserva válido.' });
      return;
    }
    window.location.assign(`/checkout.html?reservationId=${encodeURIComponent(reservationId)}`);
  };

  return (
    <div className="app">
      <header className="topbar">
        <div className="brand">
          <div className="brand-badge">it</div>
          <div>
            <h1>it | marketplace de limpieza</h1>
            <p>React SPA inspirada en Uber/Airbnb para conectar clientes y cleaners</p>
          </div>
        </div>
        <div className="top-actions">
          <button className="pill" onClick={() => window.open('/swagger-ui/index.html', '_blank')}>Swagger</button>
          <button className="pill" onClick={() => window.open('/api/info', '_blank')}>API info</button>
          <button className="primary" onClick={() => loadMarketplace()} disabled={busy}>Refrescar</button>
        </div>
      </header>

      <div className="grid">
        <aside className="sidebar">
          <div className="section-title">
            <h3>Escenas</h3>
            <p>{busy ? 'Cargando…' : 'UI completa'}</p>
          </div>
          <div className="nav-list">
            {screens.map((item) => (
              <button key={item.id} className={`nav-btn ${screen === item.id ? 'active' : ''}`} onClick={() => setScreen(item.id)}>
                {item.label}
              </button>
            ))}
          </div>
          <div className="divider"></div>
          <div className="card">
            <div className="section-title"><h3>Acceso</h3></div>
            <div className="row">
              <button className={`nav-btn ${auth.mode === 'none' ? 'active' : ''}`} onClick={() => setAuth((current) => ({ ...current, mode: 'none' }))}>Sin auth</button>
              <button className={`nav-btn ${auth.mode === 'bearer' ? 'active' : ''}`} onClick={() => setAuth((current) => ({ ...current, mode: 'bearer' }))}>Bearer</button>
            </div>
            <div style={{height:8}}></div>
            <button className={`nav-btn ${auth.mode === 'basic' ? 'active' : ''}`} onClick={() => setAuth((current) => ({ ...current, mode: 'basic' }))}>Basic</button>
            <div style={{height:10}}></div>
            <input className="input" placeholder="Email activo" value={auth.email} onChange={(e) => setAuth((current) => ({ ...current, email: e.target.value }))} />
            {auth.mode === 'bearer' && <input className="input" style={{marginTop:10}} placeholder="JWT token" value={auth.token} onChange={(e) => setAuth((current) => ({ ...current, token: e.target.value }))} />}
            {auth.mode === 'basic' && (
              <>
                <input className="input" style={{marginTop:10}} placeholder="Usuario basic" value={auth.basicUser} onChange={(e) => setAuth((current) => ({ ...current, basicUser: e.target.value }))} />
                <input className="input" style={{marginTop:10}} placeholder="Contraseña basic" type="password" value={auth.basicPassword} onChange={(e) => setAuth((current) => ({ ...current, basicPassword: e.target.value }))} />
              </>
            )}
            <div className="actions">
              <button className="primary" onClick={() => { saveAuth(auth); setMessage({ type: 'ok', text: 'Acceso guardado.' }); }}>Guardar</button>
              <button className="ghost" onClick={() => setAuth({ mode: 'none', token: '', basicUser: '', basicPassword: '', email: 'client@example.com' })}>Limpiar</button>
            </div>
          </div>
        </aside>

        <main className="screen">
          {message?.text && <div className={`message ${message.type}`} role="status" aria-live="polite">{message.text}</div>}

          {screen === 'home' && (
            <>
              <section className="hero">
                <div className="hero-grid">
                  <div>
                    <div className="chips">
                      <span className="chip">Marketplace</span>
                      <span className="chip">Reservas</span>
                      <span className="chip">Pagos</span>
                      <span className="chip">Reseñas</span>
                    </div>
                    <h2 className="headline">Una interfaz web React para conectar clientes con cleaners, publicar jobs y cerrar reservas.</h2>
                    <p className="sub">La experiencia combina el patrón de Uber/Airbnb: descubre talento, reserva una ventana horaria, paga el servicio y deja reseñas. Todo consumiendo los endpoints ya expuestos por el backend.</p>
                    <div className="actions">
                      <button className="primary" onClick={() => setScreen('discover')}>Explorar cleaners</button>
                      <button className="ghost" onClick={() => setScreen('reservation')}>Crear reserva</button>
                    </div>
                    <div className="stats">
                      {stats.map((stat) => (
                        <div key={stat.label} className="stat">
                          <strong>{stat.value}</strong>
                          <span>{stat.label}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                  <div className="card">
                    <div className="section-title"><h3>Propuesta</h3></div>
                    <div className="list">
                      {sampleQuotes.map((quote) => <div key={quote} className="cleaner-card">{quote}</div>)}
                    </div>
                  </div>
                </div>
              </section>

              <div style={{height:16}}></div>

              <div className="mini-grid">
                {publicCards.map((card) => (
                  <div key={card.title} className="card">
                    <h3>{card.title}</h3>
                    <p className="muted">{card.text}</p>
                  </div>
                ))}
              </div>

              <div style={{height:18}}></div>

              <div className="two-col">
                <div className="card">
                  <div className="section-title">
                    <div>
                      <h3>Top cleaners</h3>
                      <p>Perfiles visibles en el marketplace</p>
                    </div>
                    <button className="ghost" onClick={() => setScreen('discover')}>Ver todos</button>
                  </div>
                  <div className="list">
                    {featured.map((cleaner) => (
                      <div className="cleaner-card" key={cleaner.id || cleaner.email}>
                        <div className="card-top">
                          <div>
                            <strong>{cleaner.name || cleaner.email}</strong>
                            <div className="muted">{cleaner.email}</div>
                          </div>
                          <span className="tag good">★ {cleaner.rating ?? '—'}</span>
                        </div>
                        <div className="actions">
                          <button className="ghost" onClick={() => { setSelectedCleaner(cleaner.email); setReviewTarget(cleaner.email); setScreen('reviews'); }}>Ver reseñas</button>
                          <button className="primary" onClick={() => { setSelectedCleaner(cleaner.email); setForms((current) => ({ ...current, reservation: { ...current.reservation, cleanerEmail: cleaner.email } })); setScreen('reservation'); }}>Reservar</button>
                        </div>
                      </div>
                    ))}
                    {!featured.length && <div className="muted">Todavía no hay cleaners creados.</div>}
                  </div>
                </div>
                <div className="card">
                  <div className="section-title">
                    <div>
                      <h3>API expuesta</h3>
                      <p>Endpoints utilizados por la UI</p>
                    </div>
                  </div>
                  <div className="list">
                    <div className="endpoint-card"><strong>GET /api/cleaners</strong><div className="muted">Catálogo público de cleaners.</div></div>
                    <div className="endpoint-card"><strong>GET /api/jobs/open</strong><div className="muted">Jobs disponibles en el marketplace.</div></div>
                    <div className="endpoint-card"><strong>POST /api/reservations</strong><div className="muted">Reserva un servicio con horario.</div></div>
                    <div className="endpoint-card"><strong>POST /api/payments/create-intent</strong><div className="muted">Genera el pago del servicio.</div></div>
                  </div>
                </div>
              </div>
            </>
          )}

          {screen === 'discover' && (
            <section>
              <div className="toolbar">
                <div>
                  <h2>Explorar marketplace</h2>
                  <p className="muted">Busca cleaners y jobs como si fuera Airbnb/Uber.</p>
                </div>
                <div className="chips">
                  <span className="chip">{cleaners.length} cleaners</span>
                  <span className="chip">{jobs.length} jobs abiertos</span>
                </div>
              </div>

              <div className="filters">
                <input className="input" placeholder="Buscar por nombre o email" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} />
                <button className="ghost" onClick={() => setScreen('cleaner')}>Crear cleaner</button>
                <button className="primary" onClick={() => setScreen('jobs')}>Ver jobs</button>
              </div>

              <div className="two-col">
                <div className="card">
                  <div className="section-title"><h3>Cleaners</h3><p>Tarjetas tipo marketplace</p></div>
                  <div className="list">
                    {filteredCleaners.map((cleaner) => (
                      <div key={cleaner.id || cleaner.email} className="cleaner-card">
                        <div className="card-top">
                          <div>
                            <strong>{cleaner.name || cleaner.email}</strong>
                            <div className="muted">{cleaner.email}</div>
                          </div>
                          <span className="tag good">★ {cleaner.rating ?? '—'}</span>
                        </div>
                        <div className="meta">
                          <span className="tag info">Verified profile</span>
                          <span className="tag">Respuesta rápida</span>
                        </div>
                        <div className="actions">
                          <button className="ghost" onClick={() => { setSelectedCleaner(cleaner.email); setReviewTarget(cleaner.email); loadReviews(cleaner.email); setScreen('reviews'); }}>Reseñas</button>
                          <button className="primary" onClick={() => { setSelectedCleaner(cleaner.email); setForms((current) => ({ ...current, reservation: { ...current.reservation, cleanerEmail: cleaner.email } })); setScreen('reservation'); }}>Reservar</button>
                        </div>
                      </div>
                    ))}
                    {!filteredCleaners.length && <div className="muted">No hay cleaners que coincidan con la búsqueda.</div>}
                  </div>
                </div>
                <div className="card">
                  <div className="section-title"><h3>Jobs abiertos</h3><p>Publicados por clientes</p></div>
                  <div className="list">
                    {filteredJobs.map((job) => (
                      <div key={job.id} className="job-card">
                        <div className="card-top">
                          <div>
                            <strong>{job.title || `Job #${job.id}`}</strong>
                            <div className="muted">{job.description}</div>
                          </div>
                          <span className="tag warn">{money(job.priceCents || 0)}</span>
                        </div>
                        <div className="meta">
                          <span className="tag">Cliente: {job.clientEmail}</span>
                          <span className="tag">Estado: {job.status}</span>
                        </div>
                        <div className="actions">
                          <button className="primary" onClick={() => { setForms((current) => ({ ...current, reservation: { ...current.reservation, jobId: job.id, cleanerEmail: selectedCleaner || current.reservation.cleanerEmail, durationMinutes: 120 } })); setScreen('reservation'); }}>Reservar</button>
                          <button className="ghost" onClick={() => { setForms((current) => ({ ...current, job: { ...current.job, title: job.title || '', description: job.description || '', priceCents: job.priceCents || 4500 } })); setScreen('jobs'); }}>Copiar job</button>
                        </div>
                      </div>
                    ))}
                    {!filteredJobs.length && <div className="muted">No hay jobs que coincidan con la búsqueda.</div>}
                  </div>
                </div>
              </div>
            </section>
          )}

          {screen === 'jobs' && (
            <section>
              <div className="toolbar">
                <div>
                  <h2>Jobs</h2>
                  <p className="muted">Publica trabajos y acepta jobs abiertos.</p>
                </div>
                <button className="ghost" onClick={() => loadMarketplace()}>Actualizar jobs</button>
              </div>
              <div className="two-col">
                <div className="card">
                  <div className="section-title"><h3>Crear job</h3><p>Endpoint POST /api/jobs</p></div>
                  <form onSubmit={submitJob} className="list">
                    <input className="input" placeholder="Título opcional" value={forms.job.title} onChange={(e) => setForm('job', 'title', e.target.value)} />
                    <textarea className="textarea" placeholder="Describe el trabajo" value={forms.job.description} onChange={(e) => setForm('job', 'description', e.target.value)} required />
                    <div className="row">
                      <input className="input" type="number" min="0" placeholder="Precio en céntimos" value={forms.job.priceCents} onChange={(e) => setForm('job', 'priceCents', e.target.value)} />
                      <button className="primary" type="submit">Publicar</button>
                    </div>
                  </form>
                </div>
                <div className="card">
                  <div className="section-title"><h3>Jobs abiertos</h3><p>Acciones de cleaner</p></div>
                  <div className="list scroll">
                    {jobs.map((job) => (
                      <div key={job.id} className="job-card">
                        <div className="card-top">
                          <div>
                            <strong>{job.title || `Job #${job.id}`}</strong>
                            <div className="muted">{job.description}</div>
                          </div>
                          <span className="tag good">{money(job.priceCents || 0)}</span>
                        </div>
                        <div className="meta">
                          <span className="tag">Cliente {job.clientEmail}</span>
                          <span className="tag">{job.status}</span>
                        </div>
                        <div className="actions">
                          <button className="primary" onClick={() => acceptJob(job.id)}>Aceptar</button>
                          <button className="ghost" onClick={() => { setForms((current) => ({ ...current, reservation: { ...current.reservation, jobId: job.id, cleanerEmail: selectedCleaner || current.reservation.cleanerEmail } })); setScreen('reservation'); }}>Reservar</button>
                        </div>
                      </div>
                    ))}
                    {!jobs.length && <div className="muted">No hay jobs abiertos.</div>}
                  </div>
                </div>
              </div>
            </section>
          )}

          {screen === 'reservation' && (
            <section>
              <div className="toolbar">
                <div>
                  <h2>Reservas</h2>
                  <p className="muted">Flujo de booking y agenda.</p>
                </div>
                <button className="ghost" onClick={() => loadReservations()}>Actualizar</button>
              </div>
              <div className="two-col">
                <div className="card">
                  <div className="section-title"><h3>Nueva reserva</h3><p>Endpoint POST /api/reservations</p></div>
                  <form onSubmit={submitReservation} className="list">
                    <div className="row">
                      <input className="input" type="number" placeholder="Job ID" value={forms.reservation.jobId} onChange={(e) => setForm('reservation', 'jobId', e.target.value)} required />
                      <input className="input" placeholder="Cleaner email" value={forms.reservation.cleanerEmail} onChange={(e) => setForm('reservation', 'cleanerEmail', e.target.value)} required />
                    </div>
                    <div className="row">
                      <input className="input" type="datetime-local" value={forms.reservation.startAt} onChange={(e) => setForm('reservation', 'startAt', e.target.value)} required />
                      <input className="input" type="number" min="30" step="15" placeholder="Duración (min)" value={forms.reservation.durationMinutes} onChange={(e) => setForm('reservation', 'durationMinutes', e.target.value)} required />
                    </div>
                    <button className="primary" type="submit">Reservar servicio</button>
                  </form>
                </div>
                <div className="card">
                  <div className="section-title"><h3>Mis reservas</h3><p>GET /api/reservations</p></div>
                  <div className="list scroll">
                    {reservations.map((reservation) => (
                      <div key={reservation.id} className="reservation-card">
                        <div className="card-top">
                          <div>
                            <strong>Reserva #{reservation.id}</strong>
                            <div className="muted">Job {reservation.jobId} · {reservation.cleanerEmail}</div>
                          </div>
                          <span className="tag info">{reservation.status}</span>
                        </div>
                        <div className="meta">
                          <span className="tag">Inicio: {timeLabel(reservation.startAt)}</span>
                          <span className="tag">{reservation.durationMinutes} min</span>
                          <span className="tag">Cliente {reservation.clientEmail}</span>
                        </div>
                        <div className="actions">
                          <button className="primary" onClick={() => { setPaymentReservationId(reservation.id); setForms((current) => ({ ...current, payment: { reservationId: reservation.id } })); setScreen('payments'); }}>Cobrar</button>
                        </div>
                      </div>
                    ))}
                    {!reservations.length && <div className="muted">Inicia sesión con Basic/JWT para ver tus reservas.</div>}
                  </div>
                </div>
              </div>
            </section>
          )}

          {screen === 'payments' && (
            <section>
              <div className="toolbar">
                <div>
                  <h2>Pagos</h2>
                  <p className="muted">Stripe PaymentIntent y seguimiento.</p>
                </div>
                <button className="ghost" onClick={() => loadPayments(forms.payment.reservationId)}>Refrescar pagos</button>
              </div>
              <div className="two-col">
                <div className="card">
                  <div className="section-title"><h3>Pago seguro</h3><p>Stripe Payment Element</p></div>
                  <form onSubmit={submitPayment} className="list">
                    <input className="input" type="number" min="1" placeholder="Reservation ID" value={forms.payment.reservationId} onChange={(e) => setForm('payment', 'reservationId', e.target.value)} required />
                    <p className="small">El importe se calcula en el servidor a partir del job asociado; no puede modificarse desde el navegador.</p>
                    <button className="primary" type="submit">Ir al pago seguro</button>
                  </form>
                </div>
                <div className="card">
                  <div className="section-title"><h3>Pagos recientes</h3><p>GET /api/payments</p></div>
                  <div className="list scroll">
                    {payments.map((payment) => (
                      <div key={payment.id} className="payment-card">
                        <div className="card-top">
                          <div>
                            <strong>Pago #{payment.id}</strong>
                            <div className="muted">Reserva {payment.reservationId} · {payment.status}</div>
                          </div>
                          <span className="tag warn">{money(payment.amountCents || 0)}</span>
                        </div>
                        <div className="meta">
                          <span className="tag">Intent {payment.stripePaymentIntentId || '—'}</span>
                          <span className="tag">Creado {timeLabel(payment.createdAt)}</span>
                        </div>
                      </div>
                    ))}
                    {!payments.length && <div className="muted">No hay pagos cargados.</div>}
                  </div>
                </div>
              </div>
            </section>
          )}

          {screen === 'reviews' && (
            <section>
              <div className="toolbar">
                <div>
                  <h2>Reseñas</h2>
                  <p className="muted">Construye reputación como en Airbnb.</p>
                </div>
                <button className="ghost" onClick={() => reviewTarget && loadReviews(reviewTarget)}>Actualizar reseñas</button>
              </div>
              <div className="two-col">
                <div className="card">
                  <div className="section-title"><h3>Escribir reseña</h3><p>POST /api/reviews</p></div>
                  <form onSubmit={submitReview} className="list">
                    <input className="input" placeholder="Cleaner email" value={forms.review.cleanerEmail} onChange={(e) => { setForm('review', 'cleanerEmail', e.target.value); setReviewTarget(e.target.value); }} required />
                    <div className="row">
                      <select className="select" value={forms.review.rating} onChange={(e) => setForm('review', 'rating', e.target.value)}>
                        {[5,4,3,2,1].map((n) => <option key={n} value={n}>{n} estrellas</option>)}
                      </select>
                      <button className="primary" type="submit">Publicar reseña</button>
                    </div>
                    <textarea className="textarea" placeholder="Cuéntanos tu experiencia" value={forms.review.comment} onChange={(e) => setForm('review', 'comment', e.target.value)} />
                  </form>
                </div>
                <div className="card">
                  <div className="section-title"><h3>Reseñas del cleaner</h3><p>{reviewTarget || 'Selecciona un cleaner'}</p></div>
                  <div className="list scroll">
                    {reviews.map((review) => (
                      <div key={review.id} className="review-card">
                        <div className="card-top">
                          <div>
                            <strong>{review.clientEmail}</strong>
                            <div className="muted">{timeLabel(review.createdAt)}</div>
                          </div>
                          <span className="tag good">{review.rating}/5</span>
                        </div>
                        <p>{review.comment || 'Sin comentario'}</p>
                      </div>
                    ))}
                    {!reviews.length && <div className="muted">No hay reseñas para mostrar todavía.</div>}
                  </div>
                </div>
              </div>
            </section>
          )}

          {screen === 'client' && (
            <section>
              <div className="toolbar">
                <div>
                  <h2>Panel de cliente</h2>
                  <p className="muted">Resumen del historial de reservas y pagos.</p>
                </div>
                <button className="ghost" onClick={() => { loadReservations(); loadPayments(); }}>Sincronizar</button>
              </div>
              <div className="three-col">
                <div className="card">
                  <div className="kpi">{reservations.length}</div>
                  <div className="small">Reservas activas</div>
                </div>
                <div className="card">
                  <div className="kpi">{payments.length}</div>
                  <div className="small">Pagos registrados</div>
                </div>
                <div className="card">
                  <div className="kpi">{cleaners.length}</div>
                  <div className="small">Opciones disponibles</div>
                </div>
              </div>
              <div style={{height:16}}></div>
              <div className="two-col">
                <div className="card">
                  <div className="section-title"><h3>Reservas</h3><p>Visibilidad privada</p></div>
                  <table className="table">
                    <thead><tr><th>ID</th><th>Cleaner</th><th>Inicio</th><th>Estado</th></tr></thead>
                    <tbody>
                      {reservations.map((reservation) => (
                        <tr key={reservation.id}>
                          <td>{reservation.id}</td>
                          <td>{reservation.cleanerEmail}</td>
                          <td>{timeLabel(reservation.startAt)}</td>
                          <td>{reservation.status}</td>
                        </tr>
                      ))}
                      {!reservations.length && <tr><td colSpan="4" className="muted">No hay reservas accesibles aún.</td></tr>}
                    </tbody>
                  </table>
                </div>
                <div className="card">
                  <div className="section-title"><h3>Atajos</h3><p>Flujo sugerido</p></div>
                  <div className="list">
                    <div className="endpoint-card"><strong>1. Explora</strong><div className="muted">Escoge un cleaner o job desde Discover.</div></div>
                    <div className="endpoint-card"><strong>2. Reserva</strong><div className="muted">Envía jobId, cleanerEmail, startAt y duration.</div></div>
                    <div className="endpoint-card"><strong>3. Paga</strong><div className="muted">Genera el intent y guarda el checkout.</div></div>
                  </div>
                </div>
              </div>
            </section>
          )}

          {screen === 'cleaner' && (
            <section>
              <div className="toolbar">
                <div>
                  <h2>Panel de cleaner</h2>
                  <p className="muted">Alta de perfil, aceptación de jobs y reputación.</p>
                </div>
                <button className="ghost" onClick={() => loadMarketplace()}>Actualizar catálogo</button>
              </div>
              <div className="two-col">
                <div className="card">
                  <div className="section-title"><h3>Crear cleaner</h3><p>POST /api/cleaners</p></div>
                  <form onSubmit={submitCleaner} className="list">
                    <input className="input" placeholder="Email" value={forms.cleaner.email} onChange={(e) => setForm('cleaner', 'email', e.target.value)} required />
                    <input className="input" placeholder="Nombre" value={forms.cleaner.name} onChange={(e) => setForm('cleaner', 'name', e.target.value)} />
                    <input className="input" type="number" min="0" max="5" step="0.1" placeholder="Rating inicial" value={forms.cleaner.rating} onChange={(e) => setForm('cleaner', 'rating', e.target.value)} />
                    <button className="primary" type="submit">Guardar cleaner</button>
                  </form>
                </div>
                <div className="card">
                  <div className="section-title"><h3>Aceptar jobs</h3><p>Swipe-style queue</p></div>
                  <div className="list scroll">
                    {jobs.map((job) => (
                      <div key={job.id} className="job-card">
                        <div className="card-top">
                          <div>
                            <strong>{job.title || `Job #${job.id}`}</strong>
                            <div className="muted">{job.description}</div>
                          </div>
                          <span className="tag warn">{money(job.priceCents || 0)}</span>
                        </div>
                        <div className="meta">
                          <span className="tag">Cliente {job.clientEmail}</span>
                          <span className="tag">Estado {job.status}</span>
                        </div>
                        <div className="actions">
                          <button className="primary" onClick={() => acceptJob(job.id)}>Aceptar</button>
                          <button className="ghost" onClick={() => { setSelectedCleaner(job.cleanerEmail || selectedCleaner); setScreen('reviews'); }}>Reseñas</button>
                        </div>
                      </div>
                    ))}
                    {!jobs.length && <div className="muted">No hay jobs disponibles.</div>}
                  </div>
                </div>
              </div>
              <div style={{height:16}}></div>
              <div className="card">
                <div className="section-title"><h3>Tu catálogo</h3><p>Perfiles creados</p></div>
                <div className="list">
                  {cleaners.map((cleaner) => (
                    <div key={cleaner.id || cleaner.email} className="endpoint-card">
                      <div className="card-top">
                        <div><strong>{cleaner.name || cleaner.email}</strong><div className="muted">{cleaner.email}</div></div>
                        <span className="tag good">★ {cleaner.rating ?? '—'}</span>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </section>
          )}

          {screen === 'api' && (
            <section>
              <div className="toolbar">
                <div>
                  <h2>API y documentación</h2>
                  <p className="muted">Swagger, OpenAPI y resumen de pantallas.</p>
                </div>
                <div className="actions">
                  <button className="primary" onClick={() => window.open('/swagger-ui/index.html', '_blank')}>Abrir Swagger</button>
                  <button className="ghost" onClick={() => window.open('/v3/api-docs', '_blank')}>OpenAPI JSON</button>
                </div>
              </div>
              <div className="three-col">
                <div className="card"><div className="kpi">9</div><div className="small">Pantallas en la SPA</div></div>
                <div className="card"><div className="kpi">{cleaners.length}</div><div className="small">Cleaners consumidos</div></div>
                <div className="card"><div className="kpi">{jobs.length}</div><div className="small">Jobs abiertos consumidos</div></div>
              </div>
              <div style={{height:16}}></div>
              <div className="two-col">
                <div className="card">
                  <div className="section-title"><h3>Endpoints clave</h3><p>Lo que consume la UI</p></div>
                  <div className="list">
                    <div className="endpoint-card"><strong>GET /api/cleaners</strong><div className="muted">Explorar perfiles públicos.</div></div>
                    <div className="endpoint-card"><strong>POST /api/cleaners</strong><div className="muted">Alta de un cleaner.</div></div>
                    <div className="endpoint-card"><strong>GET /api/jobs/open</strong><div className="muted">Marketplace de jobs abiertos.</div></div>
                    <div className="endpoint-card"><strong>POST /api/jobs</strong><div className="muted">Crear un nuevo job.</div></div>
                    <div className="endpoint-card"><strong>POST /api/reservations</strong><div className="muted">Confirmar un booking.</div></div>
                    <div className="endpoint-card"><strong>POST /api/payments/create-intent</strong><div className="muted">Checkout con Stripe.</div></div>
                    <div className="endpoint-card"><strong>POST /api/reviews</strong><div className="muted">Publicar feedback.</div></div>
                  </div>
                </div>
                <div className="card">
                  <div className="section-title"><h3>Rutas UI</h3><p>Todas las pantallas</p></div>
                  <div className="list">
                    {screens.map((item) => <div key={item.id} className="endpoint-card"><strong>{item.label}</strong></div>)}
                  </div>
                  <p className="footer-note">Acceso público en <strong>/</strong>. La información técnica sigue disponible en <strong>/api/info</strong>.</p>
                </div>
              </div>
            </section>
          )}
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
