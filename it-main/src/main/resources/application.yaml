server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never

spring:
  application:
    name: it
  profiles:
    default: local
  lifecycle:
    timeout-per-shutdown-phase: 20s
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

security:
  jwt:
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:clean-it}
    audience: ${JWT_AUDIENCE:clean-it-api}
    jwk-set-uri: ${JWT_JWK_SET_URI:}
  basic:
    enabled: false
    username: ""
    password: ""

stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"
