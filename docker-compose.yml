services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: it
      POSTGRES_USER: it
      POSTGRES_PASSWORD: it-local-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U it -d it"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./it-main
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/it
      SPRING_DATASOURCE_USERNAME: it
      SPRING_DATASOURCE_PASSWORD: it-local-password
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      JWT_SECRET: local-compose-secret-at-least-32-characters
      JWT_ISSUER: clean-it-local
      JWT_AUDIENCE: clean-it-api
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_replace_me}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-pk_test_replace_me}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_replace_me}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    environment:
      PORT: 8080
      BACKEND_URL: http://backend:8080
    depends_on:
      - backend
    ports:
      - "3000:8080"

volumes:
  postgres-data:
